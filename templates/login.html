<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login | Plant Nursery Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    

</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light shadow">
            <div class="container-fluid">
                <h2 class="fw-bold"><span class="text-light">Plant</span><span class="hub">Hub</span></h2>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link text-light" aria-current="page" href="{{ url_for('home') }}">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="about">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{url_for('catalog')}}">Category</a>
                        </li>
                        
                        <li class="nav-item">
                            <a class="nav-link" href="/about#plant-care">Plant Care</a>
                        </li>
                    </ul>
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-outline-light rounded-pill active-btn" onclick="window.location.href='/login'">Login</button>
                        <button class="btn btn-outline-light rounded-pill px-4" onclick="window.location.href='/register'">Sign Up</button>
                       
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="container-fluid main-box" >
        <div class="container">

    <div class="login-box">

        <div class="left">

            <img src="{{url_for('static',filename='images/smilepot.jpg')}}" alt="Plant" >

        </div>

        <div class="right">

            <h1>User Login</h1>

            <p>Welcome Back! Login to continue.</p>

            <form action="/login" method="POST">

                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="username" placeholder="Enter Username" required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" placeholder="Enter Password" required>
                </div>

                <div class="options">

                    

                    <a href="{{ url_for('forgot') }}">Forgot Password?</a>

                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>

                <div class="register">
                    Don't have an account?
                    <a href="/register">Register</a>
                </div>

            </form>

        </div>

    </div>

</div>
    </div>



</body>
</html>
