<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration | Plant Nursery</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/regist.css') }}">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light shadow">
            <div class="container-fluid">
                <h2 class="fw-bold"><span class="text-light">Plant</span><span class="hub">Hub</span></h2>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link text-light" aria-current="page" href="{{url_for('home')}}">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="about">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{url_for('catalog')}}">Category</a>
                        </li>
                        
                        <li class="nav-item">
                            <a class="nav-link" href="/about#plant-care">Plant Care</a>
                        </li>
                    </ul>
                        <div class="d-flex align-items-center gap-3">
                            <button class="btn btn-outline-light rounded-pill" onclick="window.location.href='/login'">Login</button>
                            <button class="btn btn-outline-light rounded-pill px-4 active-btn" onclick="window.location.href='/register'">Sign Up</button>
                            
                        </div>


                </div>
            </div>
        </nav>
    </header>

<div class="container-fluid main-box">
    <div class="container">

    <div class="register-box">

        <h1>Create Account</h1>
        <p>Join our Plant Nursery Community 🌿</p>

        <form action="/register" method="POST" onsubmit="return validateMobile()">

            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text"
                name="fullname"
                placeholder="Full Name"
                required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input type="email"
                name="email"
                placeholder="Email Address"
                required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-phone"></i>
                <input type="tel"
                name="mobile"
                id="mobile"
                placeholder="Mobile Number"
                maxlength="10"
                required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-user-circle"></i>
                <input type="text"
                name="username"
                placeholder="Username"
                required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password"
                name="password"
                placeholder="Password"
                required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required>
            </div>

            <button class="register-btn" type="submit">
                Register
            </button>

            <div class="login-link">
                Already have an account?
                <a href="/login">Login</a>
            </div> 

        </form>

    </div>

</div>
</div>

<script>

function validateMobile() {

    var mobile = document.getElementById("mobile").value;

    if (!/^[6-9][0-9]{9}$/.test(mobile)) {

        alert("Please enter a valid 10-digit mobile number.");

        return false;
    }

    return true;
}

</script>
</body>

</html>
